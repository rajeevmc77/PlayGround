[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q -m \"not slow\""
testpaths = ["tests"]
markers = [
    "slow: exercises the full 1685-page PDF or the real BC Building Code website; skipped unless -m slow is passed",
]
