[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.vulture]
# http.server/socketserver read these handler hooks and settings by name.
# llm_compare's PairRecord.sent_pdf / sent_web are set through _record(**extra) and read as
# row["sent_pdf"] / row["sent_web"] from the dataclass's asdict() in the report, never as attributes.
ignore_names = ["do_GET", "log_message", "daemon_threads", "sent_pdf", "sent_web"]

[tool.pytest.ini_options]
addopts = "-q -m \"not slow\""
testpaths = ["tests"]
markers = [
    "slow: exercises the full 1685-page PDF or the real BC Building Code website; skipped unless -m slow is passed",
]
