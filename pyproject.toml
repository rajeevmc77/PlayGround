[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["Archive DO NOT Refer", "app.py", "src/check_directory_access.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "slow: exercises the full 1685-page PDF; skipped unless -m slow is passed",
]
