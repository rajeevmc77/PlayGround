<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MO Package TOC Viewer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="sidebar">
    <div id="tabs">
      <button id="tab-toc" class="active">Table of Contents - pdf</button>
      <button id="tab-toc-web">Table of Contents - web</button>
      <button id="tab-compare">Compare</button>
    </div>
    <div id="tree">
      <div class="toc-filters">
        <label><input type="checkbox" id="filter-figures" checked> Figures</label>
        <label><input type="checkbox" id="filter-equations" checked> Equations / Formula</label>
        <label><input type="checkbox" id="filter-tables" checked> Tables</label>
      </div>
      <div id="tree-content"></div>
    </div>
    <div id="tree-web" style="display:none">
      <div class="toc-filters">
        <label><input type="checkbox" id="filter-web-figures" checked> Figures</label>
        <label><input type="checkbox" id="filter-web-tables" checked> Tables</label>
        <label><input type="checkbox" id="filter-web-body" checked> Body Text</label>
      </div>
      <div id="tree-web-content"></div>
    </div>
  </div>
  <div id="main">
    <div id="controls">
      <button id="prev-page">&larr; Prev</button>
      <span id="page-indicator">Page 1</span>
      <button id="next-page">Next &rarr;</button>
    </div>
    <canvas id="page-canvas"></canvas>
    <div id="highlight" style="display:none"></div>
    <div id="web-image-detail" style="display:none">
      <button id="web-image-detail-close">&times;</button>
      <img id="web-image-detail-img">
      <div id="web-image-detail-alt"></div>
      <div id="web-image-detail-citation"></div>
      <a id="web-image-detail-link" target="_blank" rel="noopener">View on official site &#8599;</a>
    </div>
    <div id="web-content" style="display:none">
      <div id="web-content-header"></div>
      <div id="web-content-body" class="compare-placeholder">Click a node on the left to see its content.</div>
      <a id="web-content-link" target="_blank" rel="noopener" style="display:none">View on official site &#8599;</a>
    </div>
  </div>
  <div id="compare" style="display:none">
    <div id="compare-tree">
      <label><input type="checkbox" id="declutter-compare" checked> Hide decorative images (small icons/logos)</label>
      <div id="compare-tree-content"></div>
    </div>
    <div id="compare-images">
      <div class="compare-image-col">
        <h3>PDF Image</h3>
        <div id="compare-pdf-content" class="compare-placeholder">Click an image on the left to compare.</div>
      </div>
      <div class="compare-image-col">
        <h3>Web Image</h3>
        <div id="compare-web-content"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/static/viewer.js?v=17"></script>
</body>
</html>
