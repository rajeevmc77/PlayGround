<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MO Package TOC Viewer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="sidebar">
    <div id="tabs">
      <button id="tab-toc" class="active">Table of Contents</button>
      <button id="tab-images">Images</button>
      <button id="tab-image-tree">Table of Images</button>
      <button id="tab-web-images">BC Code (Web)</button>
      <button id="tab-compare">Compare</button>
    </div>
    <div id="tree"></div>
    <div id="images" style="display:none">
      <label><input type="checkbox" id="declutter" checked> Hide images under 40pt</label>
    </div>
    <div id="image-tree" style="display:none">
      <label><input type="checkbox" id="declutter-tree" checked> Hide images under 40pt</label>
      <div id="image-tree-content"></div>
    </div>
    <div id="web-images" style="display:none">
      <div id="web-image-tree-content"></div>
    </div>
  </div>
  <div id="main">
    <div id="controls">
      <button id="prev-page">&larr; Prev</button>
      <span id="page-indicator">Page 1</span>
      <button id="next-page">Next &rarr;</button>
    </div>
    <canvas id="page-canvas"></canvas>
    <div id="highlight" style="display:none"></div>
    <div id="web-image-detail" style="display:none">
      <button id="web-image-detail-close">&times;</button>
      <img id="web-image-detail-img">
      <div id="web-image-detail-alt"></div>
      <div id="web-image-detail-citation"></div>
      <a id="web-image-detail-link" target="_blank" rel="noopener">View on official site &#8599;</a>
    </div>
  </div>
  <div id="compare" style="display:none">
    <div id="compare-tree">
      <label><input type="checkbox" id="declutter-compare" checked> Hide images under 40pt</label>
      <div id="compare-tree-content"></div>
    </div>
    <div id="compare-images">
      <div class="compare-image-col">
        <h3>PDF Image</h3>
        <div id="compare-pdf-content" class="compare-placeholder">Click an image on the left to compare.</div>
      </div>
      <div class="compare-image-col">
        <h3>Web Image</h3>
        <div id="compare-web-content"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/static/viewer.js?v=8"></script>
</body>
</html>
