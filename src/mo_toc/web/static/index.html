<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MO Package TOC Viewer</title>
  <link rel="stylesheet" href="/static/style.css?v=6">
</head>
<body>
  <div id="tabs">
    <button id="tab-toc-both" class="active">Table of Contents - Both</button>
    <button id="tab-compare">Compare</button>
    <button id="tab-llm-compare">Image Comparison</button>
  </div>
  <div id="toc-both">
    <div id="both-tree">
      <div class="toc-filters">
        <label><input type="checkbox" id="filter-both-figures" checked> Figures</label>
        <label><input type="checkbox" id="filter-both-tables" checked> Tables</label>
        <label><input type="checkbox" id="filter-both-equations" checked> Equations / Formula</label>
        <label><input type="checkbox" id="filter-both-text" checked> Text</label>
        <label><input type="checkbox" id="filter-both-images" checked> Images</label>
      </div>
      <div id="both-tree-content"></div>
    </div>
    <div id="both-content">
      <div id="both-pdf-col" class="both-content-col">
        <h3>PDF</h3>
        <div id="both-pdf-pane" class="both-pane">
          <canvas id="both-pdf-canvas"></canvas>
          <div id="both-pdf-highlight" class="content-highlight" style="display:none"></div>
        </div>
      </div>
      <div id="both-web-col" class="both-content-col web-col">
        <h3>Web</h3>
        <div id="both-reason" class="reason-box" hidden></div>
        <div id="both-web-pane" class="both-pane">
          <div id="both-web-placeholder" class="compare-placeholder">Click an item on the left to compare.</div>
          <iframe id="both-web-frame" class="web-frame" title="Matching web content" hidden></iframe>
        </div>
      </div>
    </div>
  </div>
  <div id="compare" style="display:none">
    <div id="compare-tree">
      <div class="toc-filters">
        <label><input type="checkbox" id="filter-compare-figures" checked> Figures</label>
        <label><input type="checkbox" id="filter-compare-tables" checked> Tables</label>
        <label><input type="checkbox" id="filter-compare-equations" checked> Equations / Formula</label>
        <label><input type="checkbox" id="filter-compare-text" checked> Text</label>
        <label><input type="checkbox" id="filter-compare-images" checked> Images</label>
      </div>
      <div id="compare-tree-content"></div>
    </div>
    <div id="compare-content">
      <div id="compare-pdf-col" class="both-content-col">
        <h3>PDF</h3>
        <div id="compare-pdf-pane" class="both-pane">
          <canvas id="compare-pdf-canvas"></canvas>
          <div id="compare-pdf-highlight" class="content-highlight" style="display:none"></div>
        </div>
      </div>
      <div id="compare-web-col" class="both-content-col web-col">
        <h3>Web</h3>
        <div id="compare-reason" class="reason-box" hidden></div>
        <div id="compare-web-pane" class="both-pane">
          <div id="compare-web-placeholder" class="compare-placeholder">Click an item on the left to compare.</div>
          <iframe id="compare-web-frame" class="web-frame" title="Matching web content" hidden></iframe>
        </div>
      </div>
    </div>
  </div>
  <div id="llm-compare" style="display:none">
    <div id="llm-message" class="compare-placeholder" role="status"></div>
    <div id="llm-cards" class="llm-cards"></div>
    <div id="llm-toolbar" class="llm-toolbar" hidden>
      <select id="llm-verdict" aria-label="Filter by verdict"></select>
      <input id="llm-query" type="search" aria-label="Search by unified number" placeholder="Search unified number">
      <span id="llm-count" class="llm-count"></span>
    </div>
    <div id="llm-table" class="llm-table-wrap"></div>
  </div>
  <script type="module" src="/static/viewer.js?v=31"></script>
</body>
</html>
