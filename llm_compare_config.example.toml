# Copy to llm_compare_config.toml (git-ignored) to override defaults. The API key and model
# come from GEMINI_API_KEY / GEMINI_MODEL in the environment or .env, never from this file.
hash_match_percent = 90      # a phash score at or above this is a match and is not sent to the LLM
max_edge = 1024              # longest side, px, images are scaled down to (set from --calibrate)
max_pairs_per_call = 6       # image pairs per LLM call
max_input_tokens = 60000     # input budget per call
max_output_tokens = 8192     # output cap per call, thinking included; must cover
                             # output_tokens_per_pair x max_pairs_per_call plus thinking
                             # headroom - too low truncates answers (they fail to parse)
# reasoning_effort = "low"  # how much the model "thinks" (thinking is billed as output); one of
                          # "low" (default), "medium", "high", "minimal", "off" or "" (send
                          # nothing: the model's own default thinking). On gemini-3.8-flash one
                          # pair took 35 output tokens / 6.2 s / $0.0023 with "low" vs 1,173 /
                          # 13.7 s / $0.0065 with "", and 6 of 6 verdicts matched in a small
                          # trial. That model REJECTS "minimal" and "off" (it cannot switch
                          # thinking off), so use "low" there; other models may accept them.
# output_tokens_per_pair = 300    # estimate used by --dry-run and the TPM reservation. With
                                  # "low" gemini-3.8-flash used 35-567 per single pair (mean ~200);
                                  # with reasoning_effort = "" use about 800 (450-1,640 measured)
# token_scale = 1.0  # --calibrate suggests a value; actual input tokens were ~1.29x the
                     # tiling estimate on gemini-3.8-flash
rpm = 30                     # provider requests per minute
tpm = 250000                 # provider tokens per minute
workers = 4                  # concurrent calls
scoring_workers = 8          # threads that score and resize the images before the first call
                             # (656 pairs: ~38 s with 1, ~5 s with 8)
request_timeout_seconds = 120  # per request; a stuck one is cut off and retried. Single-pair
                             # calls took 5-28 s in the 5-pair trial (the library's own wait
                             # is 600 s, which once stalled a run for ~18 minutes)
# input_price_per_million = 0.0   # USD per 1M tokens; only needed when LiteLLM has no price
# output_price_per_million = 0.0
